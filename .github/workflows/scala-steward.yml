on:
  push:
    branches-ignore:
      - "update/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

name: Launch Scala Steward

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala-steward:
    # Scala Steward reads and opens pull requests with the workflow's token
    # when no personal access token is set; the token's default permissions
    # on this private repository failed it (pull_requests=read asked).
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04
    name: Launch Scala Steward
    steps:
      # Scala Steward needs Java 17 or later (class file version 61); the
      # runner's default Java 11 failed with UnsupportedClassVersionError.
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: "25"
          distribution: temurin
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          branches: ${{ github.ref_name }}
